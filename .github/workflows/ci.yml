name: CI

on:
  push:
    branches: [main, "rework/**", "polish/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install packages
        run: |
          uv pip install --system ruff pyright
          uv pip install --system -e "milliampere_dp/[dev]"
          uv pip install --system -e "ros_packages/milliampere_env"
          uv pip install --system -e "drl/[dev]"
          uv pip install --system -e "xai/[dev,web]"

      - name: Ruff check
        run: ruff check --no-fix --exclude "data/" .

      - name: Ruff format check
        run: ruff format --check --exclude "data/" .

      - name: Pyright
        run: pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install packages
        run: |
          uv pip install --system -e "milliampere_dp/[dev]"
          uv pip install --system -e "ros_packages/milliampere_env"
          uv pip install --system -e "drl/[dev]"
          uv pip install --system -e "xai/[dev,web]"
          uv pip install --system httpx

      - name: Test milliampere_dp
        run: cd milliampere_dp && python -m pytest --cov=milliampere_dp --cov-report=term-missing --tb=short -q

      - name: Test milliampere_env
        run: python -m pytest ros_packages/milliampere_env/tests/ --cov=milliampere_env --cov-report=term-missing --tb=short -q

      - name: Test milliampere_drl
        run: cd drl && python -m pytest --cov=milliampere_drl --cov-report=term-missing --tb=short -q

      - name: Test milliampere_xai
        run: cd xai && python -m pytest --cov=milliampere_xai --cov-report=term-missing --tb=short -q

      - name: Integration tests
        run: python -m pytest tests/integration/ --tb=short -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
