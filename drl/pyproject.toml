[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milliampere-drl"
version = "0.5.0"
description = "DRL training, evaluation, and deployment for milliAmpere1 DP"
requires-python = ">=3.8"
license = "MIT"
dependencies = [
    "milliampere-dp>=0.4.0",
    "stable-baselines3>=2.3,<3",
    "tensorboard>=2.10,<3",
    "tqdm>=4.60,<5",
    "rich>=12.0,<14",
    "gymnasium>=0.28,<0.30",
    "numpy>=1.20,<3",
    "scipy>=1.7,<2",
    "pyyaml>=6.0,<7",
    "pydantic>=2.0,<3",
    "eval-type-backport>=0.2.0; python_version < '3.10'",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
drl-train = "milliampere_drl.train:main"
drl-evaluate = "milliampere_drl.evaluate:main"
drl-deploy = "milliampere_drl.deploy:main"

[tool.uv.sources]
milliampere-dp = { path = "../milliampere_dp" }

[tool.hatch.build.targets.wheel]
packages = ["src/milliampere_drl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
