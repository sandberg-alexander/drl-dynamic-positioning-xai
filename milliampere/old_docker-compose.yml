services:
  
  rl:
    build:
      context: .
      dockerfile: Dockerfile.rl
    container_name: rl
    hostname: rl_container
    depends_on:
      - env_1
    environment:
      - ROS_MASTER_URI=http://env_1:11311
      - ROS_HOSTNAME=env_1
      - ROS_MASTER_URIS=http://env_1:11311
      - ROS_HOSTNAMES=env_1
    command: >
      bash -c "
      source /opt/ros/noetic/setup.bash &&
      tail -f /dev/null
      "
    volumes:
      - ./rl_code:/app/rl_code
      - ../data/models:/app/models
    networks:
      - ros_net
  
  xai:
    build:
      context: .
      dockerfile: Dockerfile.xai
    container_name: xai
    hostname: xai_contatiner
    depends_on:
      - env_1
    environment:
      - ROS_MASTER_URI=http://env_1:11311
      - ROS_HOSTNAME=env_1
      - ROS_MASTER_URIS=http://env_1:11311
      - ROS_HOSTNAMES=env_1
    volumes:
      - ../analysis/plots/xai:/app/plots
      - ../data/models:/app/models
      - ./rl_code/milliampereROS_env:/app/milliampereROS_env
      - ./xai_code:/app/xai_code
    networks:
      - ros_net

  env_1:
    build: ./milliampere_code
    container_name: env_1
    hostname: env_1
    environment:
      DISPLAY: ${DISPLAY}
      LD_LIBRARY_PATH: "/workspace/src/ma27"
      ROS_LANG_DISABLE: 'genlisp;gennodejs;geneus'
      ROS_LOG_DIR: '/logging/node_logs'
      ROS_MASTER_URI: http://env_1:11311
      ROS_HOSTNAME: env_1
      CATKIN_ENABLE_TESTING: '0'
      QT_X11_NO_MITSHM: 1
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    command: >
      bash -c "
      source /opt/ros/noetic/setup.bash &&
      roscore &
      sleep 3 &&
      source /root/workspace/devel/setup.bash &&
      tail -f /dev/null
      "

    volumes:
    #  - "./milliampere_code/workspace/src:/workspace/src:rw"  # Mount only the src directory
      - "./milliampere_code/workspace:/root/workspace:rw"
      - "./milliampere_code/logging:/logging:rw"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "${HOME}/.Xauthority:/root/.Xauthority:rw"
    ports:
      - "80"
      - "2020"
      - "2030"
      - "61200"
    stdin_open: true
    tty: true
    networks:
      - ros_net
  
networks:
  ros_net:
    driver: bridge