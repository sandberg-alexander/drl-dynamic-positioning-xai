# NVIDIA GPU passthrough override.
# Compose with the base file for hardware-accelerated rendering:
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up
# Or via Justfile: just up-gpu
#
# Prerequisites:
#   1. NVIDIA driver installed on host (nvidia-smi should work)
#   2. nvidia-container-toolkit installed:
#      https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
#   3. Docker configured for NVIDIA runtime:
#      sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker

services:
  drl:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/10_nvidia.json
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphics]

  xai:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/10_nvidia.json
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphics]

  simulator_local:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
