services:
  base:
    build:
      context: ..
      dockerfile: docker/Dockerfile.base
    image: my-ros-base:latest
  drl:
    build:
      context: ..
      dockerfile: docker/Dockerfile.drl
    container_name: drl
    hostname: drl_container
    depends_on:
    - base
    - simulator_local
    environment:
    - DISPLAY=${DISPLAY}
    - QT_X11_NO_MITSHM=1
    - ROS_MASTER_URI=http://simulator_local:11311
    volumes:
    - ${HOME}/.Xauthority:/root/.Xauthority:rw
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ../local_env/plots/drl:/app/plots:rw
    - ../data/models:/app/models:rw
    - ../data/xai_samples:/app/xai_samples:rw
    - ../data/runs:/app/runs:rw
    - ../drl/src/milliampere_drl:/usr/local/lib/python3.8/dist-packages/milliampere_drl:ro
    - ../configs:/app/configs:ro
    - ../milliampere_dp/src/milliampere_dp:/usr/local/lib/python3.8/dist-packages/milliampere_dp:ro
    - ../ros_packages/milliampere_env/src/milliampere_env:/root/catkin_ws/src/milliampere_env/src/milliampere_env:ro
    command: 'bash -c '' source /root/catkin_ws/devel/setup.bash && source /opt/ros/noetic/setup.bash && tail -f /dev/null ''

      '
    networks:
    - ros_local_net
    init: true
  xai:
    build:
      context: ..
      dockerfile: docker/Dockerfile.xai
    container_name: xai
    hostname: xai_container
    depends_on:
    - base
    - simulator_local
    environment:
    - DISPLAY=${DISPLAY}
    - QT_X11_NO_MITSHM=1
    - ROS_MASTER_URI=http://simulator_local:11311
    volumes:
    - ${HOME}/.Xauthority:/root/.Xauthority:rw
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ../local_env/plots/xai:/app/plots:rw
    - ../data/models:/app/models:rw
    - ../data/xai_samples:/app/xai_samples:rw
    - ../data/runs:/app/runs:rw
    - ../xai/src/milliampere_xai:/usr/local/lib/python3.8/dist-packages/milliampere_xai:ro
    - ../configs:/app/configs:ro
    - ../milliampere_dp/src/milliampere_dp:/usr/local/lib/python3.8/dist-packages/milliampere_dp:ro
    - ../ros_packages/milliampere_env/src/milliampere_env:/root/catkin_ws/src/milliampere_env/src/milliampere_env:ro
    command: 'bash -c '' source /root/catkin_ws/devel/setup.bash && source /opt/ros/noetic/setup.bash && tail -f /dev/null ''

      '
    networks:
    - ros_local_net
    init: true
  simulator_local:
    build: ../external/milliampere
    container_name: simulator_local
    hostname: simulator_local_container
    environment:
    - DISPLAY=${DISPLAY}
    - LD_LIBRARY_PATH=/workspace/src/ma27
    - ROS_LANG_DISABLE=genlisp;gennodejs;geneus
    - ROS_LOG_DIR=/logging/node_logs
    - ROS_MASTER_URI=http://simulator_local:11311
    - CATKIN_ENABLE_TESTING='0'
    - QT_X11_NO_MITSHM=1
    command: 'bash -c '' source /opt/ros/noetic/setup.bash && cd /workspace && catkin_make && roscore & sleep 5 && source /workspace/devel/setup.bash && roslaunch /workspace/src/simulator.launch & tail -f /dev/null ''

      '
    volumes:
    - ../external/milliampere/workspace:/workspace:rw
    - ../external/milliampere/logging:/logging:rw
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${HOME}/.Xauthority:/root/.Xauthority:rw
    ports:
    - '80'
    - '2020'
    - '2030'
    - 61200:61200
    - 11311:11311
    stdin_open: true
    tty: true
    networks:
    - ros_local_net
networks:
  ros_local_net:
    driver: bridge
