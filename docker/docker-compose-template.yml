# docker-compose-template.yml (For Laptop Generation)
# Build context is the repo root (..)
#
# GPU: This base config uses software rendering (works everywhere).
# For NVIDIA GPU acceleration, compose with the override:
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up
# See also: just up (no GPU) / just up-gpu (NVIDIA)
services:

  base:
    build:
      context: ..
      dockerfile: docker/Dockerfile.base
    image: my-ros-base:latest

  drl:
    build:
      context: ..
      dockerfile: docker/Dockerfile.drl
    container_name: drl
    hostname: drl_container
    depends_on:
      - base
      # DEPENDENCY_PLACEHOLDER # - simulator_local (for local mode)
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_MASTER_URI=ROS_MASTER_URI_PLACEHOLDER # e.g., http://simulator_local:11311 or http://<remote_ip>:11311
      - ROS_IP=ROS_IP_PLACEHOLDER                 # e.g., removed or <local_ip>
    volumes:
      - ${HOME}/.Xauthority:/root/.Xauthority:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../local_env/plots/drl:/app/plots:rw
      - ../data/models:/app/models:rw
      - ../data/xai_samples:/app/xai_samples:rw
      - ../data/runs:/app/runs:rw
      - ../project_mAXAI/drl_code:/app/drl_code:rw
      - ../configs:/app/configs:ro
      - ../milliampere_dp/src/milliampere_dp:/usr/local/lib/python3.8/dist-packages/milliampere_dp:ro
      - ../ros_packages/milliampere_env/src/milliampere_env:/root/catkin_ws/src/milliampere_env/src/milliampere_env:ro
    command: >
      bash -c '
      source /root/catkin_ws/devel/setup.bash &&
      source /opt/ros/noetic/setup.bash &&
      tail -f /dev/null
      '
    # NETWORK_PLACEHOLDER # networks: [- ros_local_net] (for local mode)
    network_mode: host
    init: true

  xai:
    build:
      context: ..
      dockerfile: docker/Dockerfile.xai
    container_name: xai
    hostname: xai_container
    depends_on:
      - base
      # DEPENDENCY_PLACEHOLDER # - simulator_local (for local mode)
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_MASTER_URI=ROS_MASTER_URI_PLACEHOLDER # e.g., http://simulator_local:11311 or http://<remote_ip>:11311
      - ROS_IP=ROS_IP_PLACEHOLDER                 # e.g., removed or <local_ip>
    volumes:
      - ${HOME}/.Xauthority:/root/.Xauthority:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../local_env/plots/xai:/app/plots:rw
      - ../data/models:/app/models:rw
      - ../data/xai_samples:/app/xai_samples:rw
      - ../data/runs:/app/runs:rw
      - ../project_mAXAI/xai_code:/app/xai_code:rw
      - ../configs:/app/configs:ro
      - ../milliampere_dp/src/milliampere_dp:/usr/local/lib/python3.8/dist-packages/milliampere_dp:ro
      - ../ros_packages/milliampere_env/src/milliampere_env:/root/catkin_ws/src/milliampere_env/src/milliampere_env:ro
    command: >
      bash -c '
      source /root/catkin_ws/devel/setup.bash &&
      source /opt/ros/noetic/setup.bash &&
      tail -f /dev/null
      '
    # NETWORK_PLACEHOLDER # networks: [- ros_local_net] (for local mode)
    network_mode: host
    init: true

  # --- Definition for LOCAL simulator ---
  # This whole service will be REMOVED by the script for remote mode
  simulator_local:
    build: ../external/milliampere
    container_name: simulator_local
    hostname: simulator_local_container
    environment:
      - DISPLAY=${DISPLAY}
      - LD_LIBRARY_PATH=/workspace/src/ma27
      - ROS_LANG_DISABLE=genlisp;gennodejs;geneus
      - ROS_LOG_DIR=/logging/node_logs
      - ROS_MASTER_URI=http://simulator_local:11311 # Points to itself
      - CATKIN_ENABLE_TESTING='0'
      - QT_X11_NO_MITSHM=1
    command: >
      bash -c '
      source /opt/ros/noetic/setup.bash &&
      cd /workspace && catkin_make &&
      roscore &
      sleep 5 &&
      source /workspace/devel/setup.bash &&
      roslaunch /workspace/src/simulator.launch &
      tail -f /dev/null
      '
    volumes:
      - "../external/milliampere/workspace:/workspace:rw"
      - "../external/milliampere/logging:/logging:rw"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "${HOME}/.Xauthority:/root/.Xauthority:rw"
    ports:
      - "80"
      - "2020"
      - "2030"
      - "61200:61200"
      - "11311:11311"
    stdin_open: true
    tty: true
    # NETWORK_PLACEHOLDER # networks: [- ros_local_net] (for local mode)

# NETWORK_DEFINITION_PLACEHOLDER # networks: ... (for local mode)
