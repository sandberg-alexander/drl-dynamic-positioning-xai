[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milliampere-dp"
version = "0.3.0"
description = "Shared domain library for milliAmpere1 dynamic positioning"
requires-python = ">=3.8"
license = "MIT"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5", "pandas>=1.4"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/milliampere_dp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
