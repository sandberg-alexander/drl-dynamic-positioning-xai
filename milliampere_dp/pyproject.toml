[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milliampere-dp"
version = "0.5.0"
description = "Shared domain library for milliAmpere1 dynamic positioning"
requires-python = ">=3.8"
license = "MIT"
dependencies = [
    "numpy>=1.20,<3",
    "scipy>=1.7,<2",
    "pyyaml>=6.0,<7",
    "matplotlib>=3.5,<4",
    "pandas>=1.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
plot-eval = "milliampere_dp.plotting.plot_eval:main"
plot-monitored = "milliampere_dp.plotting.plot_monitored_data:main"
plot-run = "milliampere_dp.plotting.plot_run:main"
plot-spline = "milliampere_dp.plotting.plot_spline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/milliampere_dp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
