[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milliampere-dp"
version = "0.8.0"
description = "Shared domain library for milliAmpere1 dynamic positioning"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Alexander Sandberg" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20,<3",
    "scipy>=1.7,<2",
    "pyyaml>=6.0,<7",
    "matplotlib>=3.5,<4",
    "pandas>=1.4,<3",
]

[project.urls]
Repository = "https://github.com/sandberg-alexander/drl-dynamic-positioning-xai"
Issues = "https://github.com/sandberg-alexander/drl-dynamic-positioning-xai/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
rendering = ["pydantic>=2.0,<3"]

[project.scripts]
plot-eval = "milliampere_dp.plotting.plot_eval:main"
plot-monitored = "milliampere_dp.plotting.plot_monitored_data:main"
plot-run = "milliampere_dp.plotting.plot_run:main"
plot-spline = "milliampere_dp.plotting.plot_spline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/milliampere_dp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.coverage.run]
source = ["milliampere_dp"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.", "if TYPE_CHECKING:"]
