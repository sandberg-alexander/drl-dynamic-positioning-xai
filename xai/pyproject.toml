[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milliampere-xai"
version = "0.5.0"
description = "SHAP-based XAI explainer and dashboard for milliAmpere1 DRL-DP"
requires-python = ">=3.8"
license = "MIT"
dependencies = [
    "milliampere-dp>=0.4.0",
    "stable-baselines3>=2.3,<3",
    "shap>=0.42,<1",
    "torch>=1.13,<3",
    "pygame>=2.0,<3",
    "pandas>=1.4,<3",
    "numpy>=1.20,<3",
    "opencv-python>=4.5,<5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
xai-explain = "milliampere_xai.shap_explainer:main"

[tool.uv.sources]
milliampere-dp = { path = "../milliampere_dp" }

[tool.hatch.build.targets.wheel]
packages = ["src/milliampere_xai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
