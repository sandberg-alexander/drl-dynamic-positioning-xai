[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milliampere-xai"
version = "1.11.0"
description = "SHAP-based XAI explainer and dashboard for milliAmpere1 DRL-DP"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Alexander Sandberg" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "milliampere-dp>=0.4.0",
    "stable-baselines3>=2.3,<3",
    "shap>=0.42,<1",
    "torch>=1.13,<3",
    "pygame>=2.0,<3",
    "pandas>=1.4,<3",
    "numpy>=1.20,<3",
    "opencv-python>=4.5,<5",
]

[project.urls]
Repository = "https://github.com/sandberg-alexander/drl-dynamic-positioning-xai"
Issues = "https://github.com/sandberg-alexander/drl-dynamic-positioning-xai/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
web = ["fastapi>=0.100,<1", "uvicorn[standard]>=0.24,<1", "msgpack>=1.0,<2"]

[project.scripts]
xai-explain = "milliampere_xai.shap_explainer:main"
xai-web = "milliampere_xai.server.app:main"

[tool.uv.sources]
milliampere-dp = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/milliampere_xai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.coverage.run]
source = ["milliampere_xai"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.", "if TYPE_CHECKING:"]
