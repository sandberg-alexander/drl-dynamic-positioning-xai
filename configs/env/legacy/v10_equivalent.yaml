# Legacy config equivalent to milliampere1_ros_v10.py
# Waypoint target, mode checking, angle rate penalty
action_space_type: positive_only
max_time_steps: 3000
dt: 0.1
legacy_step_sleep: 0.15

target:
  type: waypoint

reset:
  use_service: false

rewards:
  w_gauss: 1.0
  w_AS_gauss: 0.4
  sigma_d: 1.0
  sigma_psi: 250.0
  sigma_AS_d: 25.0
  sigma_AS_psi: 3500.0
  velocity_weight: 0.1
  thrust_weight: 0.1
  thrust_rate_weight: 0.1
  angle_rate_weight: 0.1
  termination_penalty: -100.0

velocity:
  use_topic: false

mode_checking:
  enabled: true
  topic: /supervisor/mode
  required_mode: drl
